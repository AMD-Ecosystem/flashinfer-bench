name: ROCm GPU tests

# Runs the ROCm / AMD-CDNA test suite inside the docker/rocm dev image on a self-hosted AMD GPU
# runner (CDNA3 gfx942 / MI300X / MI325X).
#
# Requirements to enable:
#   - A self-hosted runner labeled [self-hosted, rocm] with docker, /dev/kfd + /dev/dri, and the
#     user in the video/render groups.
#   - Network access to repo.radeon.com and pypi.amd.com (for the image build).
#
# Manual trigger by default (self-hosted GPU runners are a shared, scarce resource). Uncomment the
# pull_request trigger once a runner is wired up.
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "flashinfer_bench/**"
  #     - "tests/**"
  #     - "docker/rocm/**"
  #     - "pyproject.toml"

jobs:
  rocm-gpu-test:
    name: ROCm GPU tests (${{ vars.ROCM_ARCH || 'gfx942' }})
    # Security guard: only run for repo-owned branches, never for forked-PR code — a self-hosted
    # GPU runner must not execute untrusted PRs. Keep this even if the pull_request trigger is
    # enabled above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rocm]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ROCM_ARCH is a list, not a constant: set the `ROCM_ARCH` repo variable when the runner is
      # not CDNA3, so the image's PYTORCH_ROCM_ARCH / TVM_FFI_ROCM_ARCH_LIST match the hardware
      # actually attached. Space-separated for multiple targets, matching docker/rocm/README.md:
      # e.g. `gfx942` or `gfx942 gfx950`. The job name above reports whichever value is in effect.
      - name: Build ROCm dev image
        run: |
          DOCKER_BUILDKIT=0 docker build --build-arg ROCM_ARCH="${ROCM_ARCH}" \
            -f docker/rocm/Dockerfile -t flashinfer-bench:rocm-ci docker/rocm
        env:
          ROCM_ARCH: ${{ vars.ROCM_ARCH || 'gfx942' }}

      - name: P0 stack validation + test suite
        run: |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add video --group-add render \
            --security-opt seccomp=unconfined --ipc=host \
            --shm-size=16g \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            flashinfer-bench:rocm-ci bash -lc '
              set -e
              python3 -m pip install -e /workspace --no-deps -q
              python3 docker/rocm/validate_p0.py
              # The only check that exercises real rocprofv3 output. The unit tests cannot cover
              # this: their CSV fixtures are hand-written, so they agree with whatever schema the
              # code assumes — which is exactly how region correlation stayed broken unnoticed.
              python3 docker/rocm/validate_rocprof.py
              python3 -m pytest tests/compile tests/agent tests/integration/test_aiter_generator.py \
                -q --reruns 2 -m "not slow"
            '

      # The container runs as root over the bind-mounted workspace, so pip/pytest leave root-owned
      # egg-info, __pycache__ and (after a HIP fault) multi-hundred-MB core dumps behind. The next
      # actions/checkout runs as the unprivileged runner user and cannot clean them, which wedges a
      # self-hosted runner until someone intervenes by hand. Hand ownership back, always.
      - name: Restore workspace ownership
        if: always()
        run: |
          # Double quotes on purpose: $(id -u)/$(id -g) expand in the runner's shell, so the
          # container chowns to the runner user rather than to its own root.
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            flashinfer-bench:rocm-ci \
            bash -lc "rm -f /workspace/core /workspace/core.*; chown -R $(id -u):$(id -g) /workspace" \
            || true
