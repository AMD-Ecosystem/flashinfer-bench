[build-system]
requires = ["setuptools>=61.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashinfer-bench"
dynamic = ["version"]
description = "FlashInfer-Bench - AI for AI Infrastructure for Accelerating AI Deployment"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "Apache License 2.0" }
authors = [{ name = "FlashInfer team" }]
keywords = ["deep-learning", "inference", "benchmark", "flashinfer", "gpu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # torch must be the ROCm build on AMD GPUs; install it first from
  # https://repo.radeon.com/rocm/manylinux/rocm-rel-<ver>/ (see docs/start/installation.mdx).
  "torch>=2.8.0",
  "pydantic>=2.0.0",
  "safetensors>=0.5.0",
  # NOTE: the ROCm FlashInfer package (`amd-flashinfer`, imported as `flashinfer`) is only needed
  # for the flashinfer integration/apply path and lives on AMD's package index, so it is an
  # optional dependency under the `rocm` extra rather than a hard requirement.
  "apache-tvm-ffi>=0.1.2",
  "docstring-parser>=0.16",
  "pyyaml>=6.0",
  # Imported unconditionally by flashinfer_bench.compile.registry. Reaches us transitively via
  # torch today, so the omission is currently masked — declare it rather than rely on that.
  "filelock>=3.12",
]

[project.urls]
Homepage = "https://bench.flashinfer.ai"
Documentation = "https://bench.flashinfer.ai/docs"
Repository = "https://github.com/flashinfer-ai/flashinfer-bench"
Issues = "https://github.com/flashinfer-ai/flashinfer-bench/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio",
  "pytest-cov>=4.0.0",
  "httpx",
  "black>=22.0.0",
  "isort>=5.0.0",
  "mypy>=1.0.0",
  "ruff>=0.1.0",
  "pre-commit>=3.0.0",
  # setuptools is required by torch cpp extension, but torch does not declare it
  # as a dependency on python <= 3.11
  "setuptools",
]
serve = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0"]
# ROCm / AMD GPU runtime. These wheels live on AMD's package index (not PyPI). They are versioned
# per ROCm release and the two packages are published under different index paths — pin the indexes
# that match your ROCm version to avoid mixing incompatible wheels. The values below mirror
# docker/rocm/Dockerfile (ROCm 7.2): `amd-flashinfer` from the rocm-7.2.0 index, `amd_aiter` from
# the rocm-7.1.1 index. `amd-flashinfer` imports as `flashinfer`; `amd_aiter` powers AITER solutions.
#   pip install "flashinfer-bench[rocm]" \
#     --extra-index-url https://pypi.amd.com/rocm-7.2.0/simple/   # amd-flashinfer \
#     --extra-index-url https://pypi.amd.com/rocm-7.1.1/simple/   # amd_aiter
rocm = ["amd-flashinfer", "amd_aiter"]

[project.scripts]
flashinfer-bench = "flashinfer_bench.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["flashinfer_bench*"]

[tool.setuptools.package-data]
"flashinfer_bench" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
include = ["flashinfer_bench/**/*.py", "tests/**/*.py"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E741", "F402", "F823", "E731"]
# TID252: Prefer absolute imports over relative imports from parent modules
select = ["C", "E", "F", "W", "TID252"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E741"]
"flashinfer_bench/compile/builders/triton_builder.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-rA --durations=0 --ignore=3rdparty"
markers = ["requires_torch_cuda: tests that require torch and CUDA available"]
log_cli = true
log_cli_level = "INFO"

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"
